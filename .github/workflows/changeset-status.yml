name: Changeset status

# Comments on each PR whether it has a changeset, and what would be released. It never blocks
# merging: docs, CI and refactor PRs don't need one. Set up as in the Changesets docs
# (https://changesets.dev/guide/automating): `pull_request_target` so fork PRs get a comment too,
# which is safe because no code from the PR runs.
on:
  pull_request_target:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}

jobs:
  pr-status:
    # The release PR never has changesets.
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      comment-body: ${{ steps.pr-status.outputs.comment-body }}
    steps:
      - uses: actions/checkout@v7
      - id: pr-status
        uses: changesets/action/pr-status@v2

  pr-comment:
    needs: pr-status
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
    steps:
      - uses: changesets/action/pr-comment@v2
        with:
          body: ${{ needs.pr-status.outputs.comment-body }}
