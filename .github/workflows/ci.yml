name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Started by dependabot-changeset.yml after it pushes a changeset.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Uses the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec oxfmt --check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Also runs plugin-kit's package checks.
      - run: pnpm build
